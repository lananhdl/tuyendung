<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Trắc Nghiệm OOP (Bảo mật)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; }
        .hidden { display: none; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .question { margin-bottom: 15px; font-weight: bold; }
        .options label { display: block; margin-bottom: 5px; cursor: pointer; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .leaderboard { background: #ffd700; padding: 10px; border-radius: 5px; margin-top: 20px; }
        
        /* CHỐNG BÔI ĐEN VÀ COPY CỤC BỘ */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* MÀN HÌNH ĐEN CHỐNG CHỤP MÀN HÌNH */
        #blackout {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<!-- Áp dụng class no-select cho toàn bộ trang -->
<body class="no-select" oncontextmenu="return false;"> 

    <!-- Lớp phủ màn hình đen -->
    <div id="blackout">Phát hiện chuyển cửa sổ hoặc chụp màn hình! Nội dung đã bị ẩn.</div>

    <h2>Học Phần: Lập trình hướng đối tượng (OOP)</h2>
    
    <div id="setupSection" class="card">
        <input type="text" id="username" placeholder="Nhập mã SV (Bắt buộc)" required>
        <select id="sessionSelect">
            <option value="session1">Buổi 1: Mở đầu & Khái niệm OOP</option>
        </select>
        <select id="typeSelect">
            <option value="inclass">Tại lớp (Chỉ nộp 1 lần)</option>
            <option value="homework">Về nhà</option>
        </select>
        <button onclick="loadQuestions()">Tải Câu Hỏi</button>
    </div>

    <!-- Khu vực Quiz -->
    <div id="quizSection" class="card hidden">
        <h3 id="quizTitle"></h3>
        <div id="quizContainer"></div>
        <button id="submitBtn" style="margin-top: 15px;" onclick="submitQuiz()">Nộp Bài</button>
    </div>

    <!-- Khu vực Kết quả & Leaderboard -->
    <div id="resultSection" class="card hidden">
        <h3 id="finalScore"></h3>
        <div class="leaderboard">
            <h4>🏆 Bảng Vàng Điểm Cao Nhất</h4>
            <ul id="leaderboardList"></ul>
        </div>
        <button onclick="location.reload()">Quay lại</button>
    </div>

    <script>
        // DÁN WEB APP URL CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8NXXxTR-9lDuCoDZIqCcKZ9faoMfkQHerfdLtDwkGrlzS4FwuaLNMT3OBBhgquE-cqg/exec'; 
        
        let currentQuestions = [];
        let username = '';
        let session = '';
        let type = '';

        // --- CÁC BIỆN PHÁP CHỐNG GIAN LẬN FRONTEND ---
        // 1. Chặn phím tắt Copy/Cut/Paste
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'x' || e.key === 'v' || e.key === 'p' || e.key === 's')) {
                e.preventDefault();
                alert('Hành động này bị cấm!');
            }
            // 2. Chặn phím PrintScreen
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText(''); // Xóa clipboard
                document.getElementById('blackout').style.display = 'flex';
                setTimeout(() => { document.getElementById('blackout').style.display = 'none'; }, 3000);
            }
        });

        // 3. Màn hình đen khi người dùng chuyển tab hoặc mở Snipping Tool
        window.addEventListener('blur', () => {
            if (!document.getElementById('quizSection').classList.contains('hidden')) {
                document.getElementById('blackout').style.display = 'flex';
            }
        });
        window.addEventListener('focus', () => {
            document.getElementById('blackout').style.display = 'none';
        });
        // ---------------------------------------------

        function loadQuestions() {
            username = document.getElementById('username').value.trim();
            session = document.getElementById('sessionSelect').value;
            type = document.getElementById('typeSelect').value;
            
            if(!username) return alert('Vui lòng nhập Mã Sinh Viên!');
            
            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('quizContainer').innerHTML = 'Đang tải dữ liệu từ Google Sheets...';
            document.getElementById('quizSection').classList.remove('hidden');

            fetch(`${SCRIPT_URL}?action=getQuestions&session=${session}&type=${type}`)
                .then(res => res.json())
                .then(data => {
                    currentQuestions = data;
                    renderQuestions();
                });
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            
            if(currentQuestions.length === 0) {
                container.innerHTML = '<i>Chưa có câu hỏi cho phần này.</i>';
                return;
            }

            currentQuestions.forEach((q, index) => {
                const html = `
                    <div class="question">${index + 1}. ${q.q}</div>
                    <div class="options">
                        <label><input type="radio" name="q${index}" value="A"> A. ${q.a}</label>
                        <label><input type="radio" name="q${index}" value="B"> B. ${q.b}</label>
                        <label><input type="radio" name="q${index}" value="C"> C. ${q.c}</label>
                        <label><input type="radio" name="q${index}" value="D"> D. ${q.d}</label>
                    </div>
                    <hr>
                `;
                container.innerHTML += html;
            });
        }

        function submitQuiz() {
            let score = 0;
            currentQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if(selected && selected.value === q.correct) {
                    score += 1;
                }
            });

            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('finalScore').innerText = `Đang chấm điểm và xác thực hệ thống...`;

            fetch(`${SCRIPT_URL}?action=submitResult&username=${username}&session=${session}&type=${type}&score=${score}`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'error') {
                        // Backend báo lỗi đã nộp bài
                        document.getElementById('finalScore').innerHTML = `<span style="color:red">${data.message}</span>`;
                        document.querySelector('.leaderboard').classList.add('hidden');
                    } else {
                        // Nộp bài thành công
                        document.getElementById('finalScore').innerText = `Điểm của bạn: ${score}/${currentQuestions.length}`;
                        
                        const lbList = document.getElementById('leaderboardList');
                        lbList.innerHTML = '';
                        document.querySelector('.leaderboard').classList.remove('hidden');
                        data.top.forEach(student => {
                            lbList.innerHTML += `<li><strong>${student.name}</strong>: ${student.score} điểm</li>`;
                        });
                    }
                })
                .catch(err => {
                    document.getElementById('finalScore').innerText = "Lỗi kết nối. Vui lòng thử lại.";
                });
        }
    </script>
</body>
</html>
