<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Phim Trực Tuyến</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #141414; color: #fff; text-align: center; }
        .container { max-width: 900px; margin: 30px auto; background: #1f1f1f; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 30px; text-align: left; }
        
        .movie-card { background: #2a2a2a; border-radius: 8px; overflow: hidden; display: block; text-decoration: none; color: inherit; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 250px; object-fit: cover; background: #333; display: block; }
        .movie-info { padding: 10px; text-align: center; }
        .movie-info h3 { font-size: 14px; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #notification { font-size: 18px; color: #ffcc00; margin: 20px 0; font-weight: bold; min-height: 30px; }
        .copy-hint { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="content-area">
        <h1>Kho Phim Trực Tuyến</h1>
        <p>Chọn phim để xem, hoặc <b>chuột phải vào phim chọn "Sao chép liên kết"</b> để gửi cho bạn bè.</p>
        
        <!-- Danh sách phim tải từ Google Sheet -->
        <div class="movie-grid" id="movie-list">
            <p style="grid-column: 1 / -1; text-align: center;">Đang kết nối tới Kho Phim ...</p>
        </div>
    </div>
</div>

<script>
    // Điền link API /exec của Google Apps Script vào đây
    const API_URL = "https://script.google.com/macros/s/AKfycbzVC3MBsINF8Sp1FmyVrv43gPqq2_UNePvkC9qnJ9KG-YjFvFjP-eVQ_QHEqzJpdsO23Q/exec";

    window.onload = function() {
        // Kiểm tra xem trên URL có chứa tham số mã phim hay không
        const urlParams = new URLSearchParams(window.location.search);
        const movieIndex = urlParams.get('play');

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                if (movieIndex !== null && data[movieIndex]) {
                    // Nếu có mã 'play', thực hiện kích hoạt mở link phụ và đếm ngược chuyển hướng
                    executeRedirectFlow(data[movieIndex]);
                } else {
                    // Hiển thị danh sách phim bình thường
                    renderMovies(data);
                }
            })
            .catch(error => {
                console.error('Lỗi lấy dữ liệu:', error);
                document.getElementById('movie-list').innerHTML = '<p style="color: red; grid-column: 1 / -1; text-align: center;">Không thể tải dữ liệu từ Google Sheet.</p>';
            });
    };

    function renderMovies(movies) {
        const grid = document.getElementById('movie-list');
        grid.innerHTML = '';

        if (!movies || movies.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Chưa có dữ liệu phim.</p>';
            return;
        }

        // Lấy đường dẫn gốc hiện tại của file/trang web
        const currentUrl = window.location.href.split('?')[0];

        movies.forEach((movie, index) => {
            let posterUrl = movie.poster;
            if (posterUrl && posterUrl.includes('drive.google.com')) {
                let fileIdMatch = posterUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (fileIdMatch) {
                    posterUrl = `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
                }
            }
            const finalPoster = posterUrl ? posterUrl : 'https://via.placeholder.com/180x250?text=No+Image';

            // Tạo link chuẩn gắn sẵn tham số ?play=index để khi click hoặc copy link đều hoạt động tuyệt đối
            const shareableLink = `${currentUrl}?play=${index}`;

            const card = document.createElement('a');
            card.className = 'movie-card';
            card.href = shareableLink; // Cho phép chuột phải copy link chuẩn xác
            
            card.innerHTML = `
                <img src="${finalPoster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/180x250?text=Error'">
                <div class="movie-info">
                    <h3>${movie.title}</h3>
                    <div class="copy-hint">Nhấp xem / Chuột phải copy link</div>
                </div>
            `;

            // Bắt sự kiện click mượt mà để chạy cơ chế mở tab phụ và đếm ngược chuyển hướng ngay lập tức
            card.addEventListener('click', (e) => {
                e.preventDefault(); // Ngăn load lại trang thô cứng
                executeRedirectFlow(movie);
            });

            grid.appendChild(card);
        });
    }

    function executeRedirectFlow(movie) {
        // Thay đổi giao diện thông báo đếm ngược
        document.querySelector('.container').innerHTML = `
            <h1>Đang chuẩn bị phát phim...</h1>
            <h2 style="color: #ffcc00; margin: 30px 0;" id="countdown-text">Đang mở trang phụ, chuyển hướng sang YouTube sau 3s...</h2>
            <p>Vui lòng đợi trong giây lát!</p>
        `;

        // 1. Mở ngay link phụ (Cột D) ra một tab mới độc lập
        if (movie.adsLink) {
            const a = document.createElement('a');
            a.href = movie.adsLink;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 2. Đếm ngược 3 giây trên màn hình hiện tại rồi chuyển sang YouTube chính thức (Cột C)
        let countdown = 3;
        const countdownText = document.getElementById('countdown-text');
        
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                countdownText.innerText = `Đang mở trang phụ, chuyển hướng sang YouTube sau ${countdown}s...`;
            } else {
                clearInterval(timer);
                if (movie.movieLink) {
                    window.location.href = movie.movieLink;
                }
            }
        }, 1000);
    }
</script>

</body>
</html>
